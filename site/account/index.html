<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Dashboard — Apeiron Solutions</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/fonts.css"><link rel="stylesheet" href="../css/portal.css">
<script src="../theme.js"></script></head>
<body>
<header class="bar">
  <div class="bar-brand">
    <a class="logo" href="../" aria-label="Apeiron Solutions home">APEIRON</a>
  </div>
  <nav class="portal-nav" id="portal-nav" aria-label="Client Portal Navigation">
    <button type="button" class="portal-nav-btn active" id="tab-dash" aria-selected="true" role="tab">Projects</button>
    <button type="button" class="portal-nav-btn nav-chat-btn" id="tab-chat" aria-selected="false" role="tab" aria-label="Messages" title="Messages (Client–Team Conversations)" hidden>
      <svg class="nav-chat-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span class="nav-chat-label">Messages</span>
      <span class="nav-chat-badge" id="chat-badge" hidden></span>
    </button>
    <button type="button" class="portal-nav-btn nav-settings-btn" id="tab-settings" aria-selected="false" role="tab" aria-label="Settings" title="Account & Portal Settings">
      <svg class="nav-settings-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span class="nav-settings-label">Settings</span>
    </button>
    <button type="button" class="portal-nav-btn theme-toggle" id="portal-theme-toggle" data-theme-toggle aria-label="Switch to light theme" title="Toggle theme">
      <svg class="theme-icon sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="theme-icon moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <button type="button" class="portal-nav-btn" id="tab-prof" style="display:none;" aria-hidden="true">Profile</button>
  </nav>
  <div class="who" id="who"></div>
</header>
<main class="wrap" id="app"><p class="mono">Loading…</p></main>
<script type="module" src="account.js"></script>
</body></html>
