<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apeiron Admin</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="admin.css"></head>
<body>
<header class="top"><b class="brand">APEIRON <span>ADMIN</span></b><span class="who" id="who"></span><button id="out" type="button" hidden>Sign out</button></header>
<main>
  <form id="login" novalidate>
    <h1>Admin sign in</h1>
    <label>Email<input id="em" type="email" autocomplete="username" required></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Sign in</button><p id="lerr" class="err" role="alert"></p>
  </form>
  <section id="app" hidden>
    <nav class="tabs" role="tablist"><button role="tab" id="t-req" aria-selected="true">Project requests <span class="count" id="c-req"></span></button><button role="tab" id="t-msg" aria-selected="false">Messages <span class="count" id="c-msg"></span></button></nav>
    <div id="p-req">
      <div class="bar"><select id="qf" aria-label="Filter requests"><option value="">All requests</option><option value="submitted">Pending</option><option value="accepted">Accepted</option><option value="declined">Rejected</option><option value="draft">Drafts</option></select><span class="meta" id="live">Updates every 15 seconds</span></div>
      <div id="quotes"></div>
    </div>
    <div id="p-msg" hidden>
      <div class="bar"><input id="q" type="search" placeholder="Search name, email, message" aria-label="Search"><select id="st" aria-label="Status filter"><option value="">All</option><option>new</option><option>contacted</option><option>qualified</option><option>closed</option><option>spam</option></select><a href="/api/admin/export.csv" class="btn">Export CSV</a></div>
      <div id="list"></div>
    </div>
  </section>
</main>
<script src="admin.js"></script>
</body></html>
