<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Not Found · Apeiron Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
  <style>
    .not-found-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .not-found-card {
      max-width: 480px;
      padding: clamp(32px, 5vw, 48px);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.055) 0%, rgba(18, 25, 35, 0.55) 50%, rgba(10, 15, 22, 0.75) 100%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      backdrop-filter: blur(16px) saturate(130%);
      border: 1px solid var(--liquid-glass-edge);
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.50), var(--liquid-glass-highlight-focal);
    }
    .code-badge {
      display: inline-block;
      font: 700 13px var(--m);
      letter-spacing: .14em;
      color: var(--cyan);
      background: var(--cyan-subtle);
      border: 1px solid rgba(56, 213, 255, 0.35);
      padding: 4px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .not-found-card h1 {
      font: 700 clamp(28px, 4vw, 36px)/1.1 var(--fh);
      text-transform: uppercase;
      margin: 0 0 12px;
      color: #fff;
    }
    .not-found-card p {
      color: var(--mute);
      margin: 0 0 24px;
      font-size: 15px;
    }
  </style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<header class="top">
  <div class="brand-bar">
    <a href="/" class="brand-link" aria-label="Apeiron Solutions">
      <span class="apeiron-logo-wrap is-flowing">
        <img src="apeiron-logo-sm.webp" alt="Apeiron Solutions" class="apeiron-logo-art" width="1024" height="572">
        <svg class="apeiron-energy-svg" viewBox="0 0 1024 572" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="apeironEnergyGrad404" x1="95" y1="235" x2="925" y2="235" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38D5FF" stop-opacity="0.9"/>
              <stop offset="35%" stop-color="#38D5FF" stop-opacity="0.95"/>
              <stop offset="46%" stop-color="#4ac5f8" stop-opacity="0.95"/>
              <stop offset="54%" stop-color="#e6b84a" stop-opacity="0.95"/>
              <stop offset="65%" stop-color="#FFAA45" stop-opacity="0.95"/>
              <stop offset="100%" stop-color="#FFAA45" stop-opacity="0.9"/>
            </linearGradient>
            <linearGradient id="apeironCoreGrad404" x1="95" y1="235" x2="925" y2="235" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#e0f8ff"/>
              <stop offset="35%" stop-color="#e8faff"/>
              <stop offset="50%" stop-color="#ffffff"/>
              <stop offset="65%" stop-color="#fff5e6"/>
              <stop offset="100%" stop-color="#ffebd0"/>
            </linearGradient>
            <filter id="apeironSoftGlow404" x="-25%" y="-25%" width="150%" height="150%">
              <feGaussianBlur stdDeviation="11" result="blur"/>
            </filter>
            <filter id="apeironCrispGlow404" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3.2" result="blur"/>
            </filter>
          </defs>
          <path class="energy-glow"
            d="M 260 370 C 165 370, 95 315, 95 235 C 95 155, 165 100, 265 100 C 365 100, 435 160, 512 232 C 590 305, 665 368, 760 368 C 850 368, 925 315, 925 250 C 925 185, 850 125, 755 125 C 665 125, 590 165, 512 232 C 435 300, 355 370, 260 370 Z"
            stroke="url(#apeironEnergyGrad404)" stroke-width="22" stroke-linecap="round" filter="url(#apeironSoftGlow404)"/>
          <path class="energy-mid"
            d="M 260 370 C 165 370, 95 315, 95 235 C 95 155, 165 100, 265 100 C 365 100, 435 160, 512 232 C 590 305, 665 368, 760 368 C 850 368, 925 315, 925 250 C 925 185, 850 125, 755 125 C 665 125, 590 165, 512 232 C 435 300, 355 370, 260 370 Z"
            stroke="url(#apeironEnergyGrad404)" stroke-width="9" stroke-linecap="round" filter="url(#apeironCrispGlow404)"/>
          <path class="energy-core"
            d="M 260 370 C 165 370, 95 315, 95 235 C 95 155, 165 100, 265 100 C 365 100, 435 160, 512 232 C 590 305, 665 368, 760 368 C 850 368, 925 315, 925 250 C 925 185, 850 125, 755 125 C 665 125, 590 165, 512 232 C 435 300, 355 370, 260 370 Z"
            stroke="url(#apeironCoreGrad404)" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
      </span>
      <b class="brand">APEIRON <span class="portal-badge">ADMIN</span></b>
    </a>
  </div>
</header>
<main>
  <div class="not-found-wrap">
    <div class="not-found-card">
      <span class="code-badge">ERROR 404</span>
      <h1>Page Not Found</h1>
      <p>The requested administrative console resource could not be found or has moved.</p>
      <a href="/" class="btn primary">Return to Dashboard</a>
    </div>
  </div>
</main>
</body>
</html>
