<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Not Found · Apeiron Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
  <style>
    .not-found-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .not-found-card {
      max-width: 480px;
      padding: clamp(32px, 5vw, 48px);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.055) 0%, rgba(18, 25, 35, 0.55) 50%, rgba(10, 15, 22, 0.75) 100%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      backdrop-filter: blur(16px) saturate(130%);
      border: 1px solid var(--liquid-glass-edge);
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.50), var(--liquid-glass-highlight-focal);
    }
    .code-badge {
      display: inline-block;
      font: 700 13px var(--m);
      letter-spacing: .14em;
      color: var(--cyan);
      background: var(--cyan-subtle);
      border: 1px solid rgba(56, 213, 255, 0.35);
      padding: 4px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .not-found-card h1 {
      font: 700 clamp(28px, 4vw, 36px)/1.1 var(--fh);
      text-transform: uppercase;
      margin: 0 0 12px;
      color: #fff;
    }
    .not-found-card p {
      color: var(--mute);
      margin: 0 0 24px;
      font-size: 15px;
    }
  </style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<header class="top">
  <div class="brand-bar">
    <a href="/" class="brand-link" aria-label="Apeiron Solutions">
      <svg class="brand-glyph" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="rgba(56, 213, 255, 0.08)"/>
        <circle cx="32" cy="32" r="18" fill="none" stroke="#38d5ff" stroke-width="3" opacity="0.6"/>
        <circle cx="32" cy="32" r="7" fill="#38d5ff"/>
      </svg>
      <b class="brand">APEIRON <span class="portal-badge">ADMIN</span></b>
    </a>
  </div>
</header>
<main>
  <div class="not-found-wrap">
    <div class="not-found-card">
      <span class="code-badge">ERROR 404</span>
      <h1>Page Not Found</h1>
      <p>The requested administrative console resource could not be found or has moved.</p>
      <a href="/" class="btn primary">Return to Dashboard</a>
    </div>
  </div>
</main>
</body>
</html>
