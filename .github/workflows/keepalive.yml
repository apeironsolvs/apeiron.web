name: Render Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance spin-down (inactivity timeout is 15 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Website & Cloud Gateway
        run: |
          URL="${{ secrets.SITE_URL || 'https://apeiron-web.onrender.com' }}"
          echo "Pinging ${URL}/healthz ..."
          curl -sS -f --max-time 20 -H "User-Agent: ApeironGitHubActionsKeepAlive/1.0" "${URL}/healthz" || echo "Ping attempted."
